<circle class="dot" cx="534" cy="265" r="4.5" fill="#c792ea" style="animation-delay:0.5s"/>
<rect class="card nb" x="545" y="150" width="150" height="230" rx="14" stroke="#e3b341" stroke-width="2.5" style="animation-delay:0.8999999999999999s"/>
<text x="620" y="184" text-anchor="middle" class="ttl" font-size="22" fill="#e3b341">4</text>
<text x="620" y="220" text-anchor="middle" class="ttl" font-size="15">Sharing /</text>
<text x="620" y="242" text-anchor="middle" class="ttl" font-size="15">suppliers</text>
