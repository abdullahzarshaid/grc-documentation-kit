<line class="ln" x1="697" y1="265" x2="715" y2="265" stroke="#e3b341" style="animation-delay:0.75s"/>
<circle class="dot" cx="706" cy="265" r="4.5" fill="#e3b341" style="animation-delay:0.75s"/>
<rect class="card nb" x="717" y="150" width="150" height="230" rx="14" stroke="#ff7b72" stroke-width="2.5" style="animation-delay:1.2s"/>
<text x="792" y="184" text-anchor="middle" class="ttl" font-size="22" fill="#ff7b72">5</text>
