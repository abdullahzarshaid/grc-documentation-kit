<text x="620" y="46" text-anchor="middle" class="ttl" font-size="28">The personal data lifecycle and the register each scene updates</text>
<rect class="card nb" x="30" y="150" width="150" height="230" rx="14" stroke="#5aa9ff" stroke-width="2.5" style="animation-delay:0.0s"/>
