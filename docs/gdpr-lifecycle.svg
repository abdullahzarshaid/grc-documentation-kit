<circle class="dot" cx="1049" cy="265" r="4.5" fill="#ff7b72" style="animation-delay:1.25s"/>
<rect class="card nb" x="1060" y="150" width="150" height="230" rx="14" stroke="#9fb0c6" stroke-width="2.5" style="animation-delay:1.7999999999999998s"/>
<text x="1135" y="184" text-anchor="middle" class="ttl" font-size="22" fill="#9fb0c6">7</text>
<text x="1135" y="220" text-anchor="middle" class="ttl" font-size="15">End of</text>
<text x="1135" y="242" text-anchor="middle" class="ttl" font-size="15">relationship</text>
<line x1="1078" y1="274" x2="1192" y2="274" stroke="#26344a"/>
<text x="1135" y="300" text-anchor="middle" class="sub" font-size="13">Deletion across</text>
<text x="1135" y="319" text-anchor="middle" class="sub" font-size="13">stores, backups,</text>
<text x="1135" y="338" text-anchor="middle" class="sub" font-size="13">logs</text>
<text x="620" y="440" text-anchor="middle" class="sub" font-size="17">Cadence: weekly (requests, incidents, supplier changes) . monthly (exports, retention) . quarterly (DPIA refresh) . annual (review)</text>
<text x="620" y="472" text-anchor="middle" class="ttl" font-size="18" fill="#5bd2ff">Every unknown becomes: To confirm, an owner and a due date, and opens a corrective action.</text>
