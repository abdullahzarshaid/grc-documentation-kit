<line class="grid" x1="0" y1="680" x2="1200" y2="680"/>
<line class="grid" x1="0" y1="720" x2="1200" y2="720"/>
<text x="600" y="48" text-anchor="middle" class="ttl" font-size="30">How the documents fit together</text>
<rect class="card nb" x="150" y="110" width="900" height="120" rx="16" stroke="#5aa9ff" stroke-width="2.5" style="animation-delay:0.0s"/>
<text x="178" y="150" class="ttl" font-size="22" fill="#5aa9ff">POLICY</text>
<text x="178" y="182" class="sub" font-size="16">What must be true. Approved by leadership. Numbered, auditable statements.</text>
<text x="178" y="208" class="ids" font-size="13">GOV-POL, PIMS-POL, SOC-POL, HIPAA-POL, AI-POL</text>
<line class="arw" x1="190" y1="230" x2="190" y2="280"/>
<circle class="dot" cx="190" cy="255" r="5" fill="#5bd2ff" style="animation-delay:0.2s"/>
<rect class="card nb" x="230" y="280" width="740" height="120" rx="16" stroke="#5bd2ff" stroke-width="2.5" style="animation-delay:0.5s"/>
<text x="258" y="320" class="ttl" font-size="22" fill="#5bd2ff">PROCEDURE</text>
<text x="258" y="352" class="sub" font-size="16">How it is done. Numbered steps with an actor, a frequency and a record.</text>
<text x="258" y="378" class="ids" font-size="13">GOV-PRO, ISMS-PRO, PIMS-PRO, GDPR-PRO, HIPAA-PRO</text>
<line class="arw" x1="270" y1="400" x2="270" y2="450"/>
<circle class="dot" cx="270" cy="425" r="5" fill="#e3b341" style="animation-delay:0.4s"/>
<rect class="card nb" x="310" y="450" width="580" height="120" rx="16" stroke="#e3b341" stroke-width="2.5" style="animation-delay:1.0s"/>
<text x="338" y="490" class="ttl" font-size="22" fill="#e3b341">REGISTER AND TEMPLATE</text>
<text x="338" y="522" class="sub" font-size="16">Where it is recorded. Excel registers with dropdowns and formulas; Word forms.</text>
<text x="338" y="548" class="ids" font-size="13">GOV-REG, ISMS-REG, PIMS-REG, SOC-REG, HIPAA-REG, AI-REG, TPL</text>
<line class="arw" x1="350" y1="570" x2="350" y2="620"/>
<circle class="dot" cx="350" cy="595" r="5" fill="#ff7b72" style="animation-delay:0.6000000000000001s"/>
<rect class="card nb" x="390" y="620" width="420" height="120" rx="16" stroke="#ff7b72" stroke-width="2.5" style="animation-delay:1.5s"/>
<text x="418" y="660" class="ttl" font-size="22" fill="#ff7b72">RECORD AND EVIDENCE</text>
<text x="418" y="692" class="sub" font-size="16">Proof it happened. Filled registers, exports, approvals, screenshots, kept privately.</text>
<text x="418" y="718" class="ids" font-size="13">Your own storage, never this repository</text>
</svg>