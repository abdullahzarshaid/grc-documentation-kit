<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="How the documents fit together: policy, procedure, register, record">
<style>
  .bg{fill:#0b1220} .grid{stroke:#0e1830;stroke-width:1}
  .card{fill:#121c2e} .ttl{fill:#e6edf3;font-weight:700} .sub{fill:#9fb0c6}
  .ids{fill:#7f93ab;font-family:Consolas,monospace}
  .arw{stroke:#9fb0c6;stroke-width:3;fill:none;stroke-dasharray:8 7;animation:flow 1.3s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-30}}
  .dot{animation:fall 3.2s ease-in-out infinite}
  @keyframes fall{0%{opacity:0}10%{opacity:1}90%{opacity:1}100%{opacity:0}}
  .nb{animation:edge 4s ease-in-out infinite}
  @keyframes edge{0%,100%{opacity:.75}50%{opacity:1}}
</style>
