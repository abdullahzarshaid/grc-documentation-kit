<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" width="1240" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="SOC 2 Type 2 readiness in 90 days then the observation period">
<style>.bg{fill:#0b1220}.grid{stroke:#0e1830;stroke-width:1}.card{fill:#121c2e}.ttl{fill:#e6edf3;font-weight:700}.sub{fill:#9fb0c6}
.ln{stroke-width:2.5;fill:none;stroke-dasharray:9 8;animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-34}}
.dot{animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.nb{animation:edge 4s ease-in-out infinite}@keyframes edge{0%,100%{opacity:.75}50%{opacity:1}}
.play{animation:sweep 7s ease-in-out infinite}@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(var(--span))}}
</style>
<rect class="bg" width="1240" height="520"/>
<line class="grid" x1="0" y1="0" x2="0" y2="520"/>
<line class="grid" x1="40" y1="0" x2="40" y2="520"/>
<line class="grid" x1="80" y1="0" x2="80" y2="520"/>
<line class="grid" x1="120" y1="0" x2="120" y2="520"/>
<line class="grid" x1="160" y1="0" x2="160" y2="520"/>
<line class="grid" x1="200" y1="0" x2="200" y2="520"/>
<line class="grid" x1="240" y1="0" x2="240" y2="520"/>
