<circle class="dot" cx="825" cy="360" r="4.5" fill="#ff7b72" style="animation-delay:0.4s"/>
<line class="line" x1="740" y1="398" x2="910" y2="584" stroke="#5bd2ff" style="animation-delay:0.6s"/>
<circle class="dot" cx="825" cy="491" r="4.5" fill="#5bd2ff" style="animation-delay:0.6s"/>
<rect class="glow" x="452" y="286" width="296" height="156" rx="20"/>
<rect class="card" x="460" y="294" width="280" height="140" rx="16" stroke="#5bd2ff" stroke-width="2.5"/>
<text x="600" y="322" text-anchor="middle" class="ctr" font-size="16">ONE CONTROL SET</text>
<text x="600" y="348" text-anchor="middle" class="sub" font-size="13.5">Governance framework and top policy</text>
<text x="600" y="370" text-anchor="middle" class="sub" font-size="13.5">49 procedures, 15 policies, 30 forms</text>
<text x="600" y="392" text-anchor="middle" class="sub" font-size="13.5">56 registers with prepared rows</text>
<text x="600" y="414" text-anchor="middle" class="sub" font-size="13.5">Risk method, SoA, crosswalk, audit</text>
<rect class="card nb" x="40" y="70" width="250" height="132" rx="14" stroke="#5aa9ff" stroke-width="2.5" style="animation-delay:0.0s"/>
<text x="165" y="110" text-anchor="middle" class="ttl" font-size="18" fill="#5aa9ff">ISO/IEC 27001:2022</text>
<text x="165" y="138" text-anchor="middle" class="sub" font-size="13">Management system: scope, risk,</text>
<text x="165" y="158" text-anchor="middle" class="sub" font-size="13">SoA, audit</text>
<rect class="card nb" x="40" y="294" width="250" height="132" rx="14" stroke="#c792ea" stroke-width="2.5" style="animation-delay:0.4s"/>
<text x="165" y="334" text-anchor="middle" class="ttl" font-size="18" fill="#c792ea">ISO/IEC 27701</text>
<text x="165" y="362" text-anchor="middle" class="sub" font-size="13">Privacy extension: controller and</text>
<text x="165" y="382" text-anchor="middle" class="sub" font-size="13">processor, RoPA, DPIA</text>
<rect class="card nb" x="40" y="518" width="250" height="132" rx="14" stroke="#5ac8c8" stroke-width="2.5" style="animation-delay:0.8s"/>
<text x="165" y="558" text-anchor="middle" class="ttl" font-size="18" fill="#5ac8c8">HIPAA</text>
<text x="165" y="586" text-anchor="middle" class="sub" font-size="13">US health data: Security, Privacy</text>
<text x="165" y="606" text-anchor="middle" class="sub" font-size="13">and Breach rules</text>
<rect class="card nb" x="910" y="70" width="250" height="132" rx="14" stroke="#e3b341" stroke-width="2.5" style="animation-delay:1.2000000000000002s"/>
<text x="1035" y="110" text-anchor="middle" class="ttl" font-size="18" fill="#e3b341">SOC 2</text>
<text x="1035" y="138" text-anchor="middle" class="sub" font-size="13">Attestation: Trust Services</text>
<text x="1035" y="158" text-anchor="middle" class="sub" font-size="13">Criteria over a period</text>
<rect class="card nb" x="910" y="294" width="250" height="132" rx="14" stroke="#ff7b72" stroke-width="2.5" style="animation-delay:1.6s"/>
<text x="1035" y="334" text-anchor="middle" class="ttl" font-size="18" fill="#ff7b72">GDPR</text>
<text x="1035" y="362" text-anchor="middle" class="sub" font-size="13">Accountability in law: notices,</text>
<text x="1035" y="382" text-anchor="middle" class="sub" font-size="13">bases, breaches, transfers</text>
<rect class="card nb" x="910" y="518" width="250" height="132" rx="14" stroke="#5bd2ff" stroke-width="2.5" style="animation-delay:2.0s"/>
<text x="1035" y="558" text-anchor="middle" class="ttl" font-size="18" fill="#5bd2ff">AI governance</text>
<text x="1035" y="586" text-anchor="middle" class="sub" font-size="13">ISO/IEC 42001, NIST AI RMF, EU AI</text>
<text x="1035" y="606" text-anchor="middle" class="sub" font-size="13">Act</text>
</svg>