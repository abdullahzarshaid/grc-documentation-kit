<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="One control set serving six frameworks">
<style>
  .bg{fill:#0b1220}
  .grid{stroke:#0e1830;stroke-width:1}
  .card{fill:#121c2e}
  .ttl{fill:#e6edf3;font-weight:700}
  .sub{fill:#9fb0c6}
  .ctr{fill:#5bd2ff;font-weight:700;letter-spacing:1px}
  .line{stroke-width:2.5;fill:none;stroke-dasharray:9 8;animation:flow 1.6s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-34}}
  .dot{animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .glow{fill:none;stroke:#5bd2ff;stroke-width:2;opacity:.25;animation:breathe 3.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.12;stroke-width:1.5}50%{opacity:.5;stroke-width:3}}
  .nb{animation:edge 4s ease-in-out infinite}
  @keyframes edge{0%,100%{opacity:.7}50%{opacity:1}}
</style>
<rect class="bg" width="1200" height="720"/>
<line class="grid" x1="0" y1="0" x2="0" y2="720"/>
