<text x="600" y="40" text-anchor="middle" class="ttl" font-size="30">One control set, six frameworks</text>
<text x="600" y="66" text-anchor="middle" class="sub" font-size="16">Policies, procedures and registers written once; each framework reads them through its own lens</text>
<line class="line" x1="460" y1="322" x2="290" y2="136" stroke="#5aa9ff" style="animation-delay:0.0s"/>
<circle class="dot" cx="375" cy="229" r="4.5" fill="#5aa9ff" style="animation-delay:0.0s"/>
<line class="line" x1="460" y1="360" x2="290" y2="360" stroke="#c792ea" style="animation-delay:0.25s"/>
<circle class="dot" cx="375" cy="360" r="4.5" fill="#c792ea" style="animation-delay:0.25s"/>
<line class="line" x1="460" y1="398" x2="290" y2="584" stroke="#5ac8c8" style="animation-delay:0.5s"/>
<circle class="dot" cx="375" cy="491" r="4.5" fill="#5ac8c8" style="animation-delay:0.5s"/>
<line class="line" x1="740" y1="322" x2="910" y2="136" stroke="#e3b341" style="animation-delay:0.15s"/>
<circle class="dot" cx="825" cy="229" r="4.5" fill="#e3b341" style="animation-delay:0.15s"/>
