  purpose: One row per Trust Services Criteria point, with a plain-words theme and an auditable control activity, then the frequency, owner, evidence, implementing documents and test method that make it real. Fill the common criteria first; add the availability, confidentiality, processing integrity and privacy rows only for the categories in your report scope.
