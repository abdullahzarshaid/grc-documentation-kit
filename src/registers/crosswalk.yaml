- id: GOV-REG-27
  key: gov-reg-27-framework-crosswalk
  title: Framework crosswalk
  framework: cross
  maps:
    - ISO/IEC 27001:2022 Annex A
    - ISO/IEC 27001:2022 clause 6.1.3
    - SOC 2 CC4.1
    - GDPR Article 24
    - GDPR Article 32
    - NIST CSF 2.0 GV.OC
  purpose: One row per Annex A control of ISO/IEC 27001:2022, recording the SOC 2 Trust Services Criteria the control contributes to, the GDPR articles it helps satisfy, the NIST CSF 2.0 categories whose outcomes it supports and the kit documents that implement it. Used to tag the shared registers and the evidence folder so that one control set serves every framework, as PB-10 describes; a mapping shows which evidence to present to whom, never that a requirement is met.
  columns:
    - {name: Annex A control, width: 10, fixed: true}
    - {name: Theme, width: 30, fixed: true, help: The same plain words as ISMS-REG-01. Read the standard for the authoritative text.}
    - {name: SOC 2 criteria, width: 22, help: Criteria the control contributes to, separated by semicolons. A listed criterion usually draws on several controls.}
    - {name: GDPR articles, width: 26, help: Articles the control helps satisfy. Security controls mostly serve Article 32; none means the regulation has no requirement this control serves.}
    - {name: NIST CSF 2.0 category, width: 18, help: Category identifiers in the form of function and category, for example PR.AA.}
    - {name: Kit documents, width: 32, help: Kit IDs separated by semicolons, the first being the primary document. Replace with your own where you have changed them.}
    - {name: Notes, width: 44, help: Where a mapping is partial or conditional.}
    - {name: Status, width: 14, values: [Confirmed, To review, Not applicable], help: Your own review of the row. Set every row to To review when a framework changes edition.}
    - {name: Last reviewed, width: 14, date: true}
