- id: GDPR-REG-02
  key: gdpr-reg-02-data-flow-and-transfer-map
  title: Data flow and transfer map
  framework: gdpr
  maps:
    - GDPR Article 30
  purpose: One row per flow of personal data between systems, functions or organisations. The operational companion to the record of processing, showing where personal data moves, how it is protected in transit and which crossings leave the region.
  columns:
    - {name: Flow ID, width: 12}
    - {name: Data items, width: 26}
    - {name: From, width: 22}
    - {name: To, width: 22}
    - {name: Internal or external, width: 16, values: [Internal, External]}
    - {name: Country, width: 16}
    - {name: Transfer method, width: 20}
    - {name: Safeguard, width: 22, help: PIMS-REG-05 mechanism where the flow leaves the region.}
    - {name: Controls, width: 24}
    - {name: Owner (role), width: 18}
    - {name: Status, width: 14, values: [Active, Under review, Ended]}
    - {name: Notes, width: 26}

- id: GDPR-REG-03
  key: gdpr-reg-03-legitimate-interests-assessment-register
  title: Legitimate interests assessment register
  framework: gdpr
  maps:
    - GDPR Article 6
  purpose: One row per processing activity that relies on legitimate interests, recording the three-part balancing test behind it. The index to the assessments held as GDPR-TPL-07, kept because legitimate interests must be justified, not assumed.
  columns:
    - {name: Assessment ID, width: 12}
    - {name: Processing, width: 26, help: PIMS-REG-01 activity.}
    - {name: Interest pursued, width: 28}
    - {name: Necessity, width: 26, help: Why the processing is needed to pursue the interest.}
    - {name: Balancing outcome, width: 20, values: [Interest prevails, Interest prevails with measures, Interest does not prevail]}
    - {name: Measures, width: 24, help: Safeguards that tip the balance, such as opt-out or minimisation.}
    - {name: Owner (role), width: 18}
    - {name: Review date, width: 14, date: true}
    - {name: Status, width: 14, values: [Draft, Approved, Superseded]}
    - {name: Notes, width: 26}

- id: GDPR-REG-04
  key: gdpr-reg-04-cookie-and-tracker-inventory
  title: Cookie and tracker inventory
  framework: gdpr
  maps:
    - GDPR Article 6
    - GDPR Article 7
  purpose: One row per cookie and tracking technology used on the organisation's sites and apps, recording its purpose, whether it needs consent and how long it lasts. The source for the cookie notice and for honouring consent choices.
  columns:
    - {name: Cookie ID, width: 12}
    - {name: Name, width: 22}
    - {name: Provider, width: 20}
    - {name: Category, width: 18, values: [Strictly necessary, Functional, Analytics, Marketing]}
    - {name: Purpose, width: 28}
    - {name: Consent required, width: 14, values: [Yes, No]}
    - {name: Duration, width: 16}
    - {name: Personal data, width: 12, values: [Yes, No]}
    - {name: Owner (role), width: 18}
    - {name: Last review, width: 14, date: true}
    - {name: Status, width: 14, values: [Active, Removed]}
    - {name: Notes, width: 26}

- id: GDPR-REG-05
  key: gdpr-reg-05-privacy-training-register
  title: Privacy training register
  framework: gdpr
  maps:
    - GDPR Article 39
  purpose: One row per person per privacy training, recording what was delivered, when and the result. Proof that staff who handle personal data know their obligations, and the companion to the security awareness register.
  columns:
    - {name: Record ID, width: 12}
    - {name: Person, width: 22}
    - {name: Role, width: 20}
    - {name: Training, width: 24}
    - {name: Type, width: 16, values: [Induction, Annual, Role-based]}
    - {name: Assigned, width: 14, date: true}
    - {name: Due, width: 14, date: true}
    - {name: Completed, width: 14, date: true}
    - {name: Result, width: 14, help: Pass, fail or score.}
    - {name: Owner (role), width: 18}
    - {name: Status, width: 14, values: [Assigned, Completed, Overdue]}
    - {name: Notes, width: 26}
