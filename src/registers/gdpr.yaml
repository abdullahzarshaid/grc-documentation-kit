- id: GDPR-REG-01
  key: gdpr-reg-01-gap-assessment
  title: GDPR gap assessment
  framework: gdpr
  maps:
    - GDPR Article 5
    - GDPR Article 24
  purpose: One row per operational GDPR obligation, grouped by chapter and article, with the requirement stated in plain words so that a small team can judge whether it is met. Run it to find the gaps, record the status and evidence, and turn each gap into an action in GDPR-REG-01 and the corrective action log.
  columns:
    - {name: Chapter, width: 26, fixed: true}
    - {name: Article, width: 12, fixed: true, help: GDPR article. Read the regulation for the authoritative text.}
    - {name: Requirement, width: 56, fixed: true, help: The obligation in plain words.}
    - {name: Applies, width: 12, values: [Yes, No]}
    - {name: Status, width: 16, values: [Compliant, Partial, Gap, Not assessed]}
    - {name: Evidence, width: 26, help: Document, register row or artefact that shows it is met.}
    - {name: Owner (role), width: 20}
    - {name: Action, width: 30, help: What will close the gap.}
    - {name: Due, width: 14, date: true}
