- id: HIPAA-REG-02
  key: hipaa-reg-02-business-associate-register
  title: Business associate register
  framework: hipaa
  maps:
    - HIPAA 45 CFR 164.308
    - HIPAA 45 CFR 164.504
  purpose: One row per business associate and subcontractor that handles protected health information on the organisation's behalf, recording the protected health information they touch, whether an agreement is in place and the assurance held. The evidence that disclosures are made only under satisfactory assurances.
  columns:
    - {name: Business associate ID, width: 14}
    - {name: Name, width: 24}
    - {name: Service, width: 26}
    - {name: Protected health information accessed, width: 26}
    - {name: Agreement in place, width: 14, values: [Yes, No, Pending]}
    - {name: Agreement date, width: 14, date: true}
    - {name: Subcontractors, width: 22, help: Whether subcontractors handle the information and are bound.}
    - {name: Assurance, width: 20, help: Certification, report or assessment held.}
    - {name: Owner (role), width: 18}
    - {name: Last review, width: 14, date: true}
    - {name: Status, width: 14, values: [Active, Under review, Exited]}
    - {name: Notes, width: 26}

- id: HIPAA-REG-03
  key: hipaa-reg-03-hipaa-breach-register
  title: HIPAA breach register
  framework: hipaa
  maps:
    - HIPAA 45 CFR 164.408
    - HIPAA 45 CFR 164.404
  purpose: One row per incident assessed under the Breach Notification Rule, whether or not it was a breach. Records the discovery date that starts the sixty-day clock, the four-factor assessment, and the notifications to individuals, HHS and the media.
  columns:
    - {name: Breach ID, width: 12}
    - {name: Discovered, width: 14, date: true, help: Starts the sixty-day clock.}
    - {name: Summary, width: 28}
    - {name: Information involved, width: 24}
    - {name: Individuals affected, width: 14}
    - {name: Unsecured, width: 12, values: [Yes, No], help: No means it was encrypted or destroyed to the standard.}
    - {name: Assessment outcome, width: 16, values: [Breach, Not a breach]}
    - {name: Individuals notified, width: 16, date: true}
    - {name: HHS notified, width: 14, date: true}
    - {name: Media notified, width: 14, values: [Yes, No, Not required]}
    - {name: Owner (role), width: 16}
    - {name: Status, width: 14, values: [Open, Assessing, Notifying, Closed]}
    - {name: Notes, width: 26}
