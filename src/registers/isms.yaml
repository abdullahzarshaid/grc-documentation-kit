- id: ISMS-REG-01
  key: isms-reg-01-statement-of-applicability
  title: Statement of Applicability
  framework: iso27001
  maps:
    - ISO/IEC 27001:2022 clause 6.1.3
    - ISO/IEC 27001:2022 Annex A
  purpose: One row per Annex A control of ISO/IEC 27001:2022, recording whether it applies, why, how far it is implemented, which kit documents implement it and where the evidence is. Reviewed with every risk assessment and whenever the scope or the context changes, and version controlled because its version appears in the certificate scope wording.
  columns:
    - {name: Control, width: 10, fixed: true, help: Annex A control number.}
    - {name: Theme, width: 30, fixed: true, help: A reminder in plain words. Read the standard for the authoritative text.}
    - {name: Applicable, width: 12, values: [Yes, No]}
    - {name: Justification, width: 44, help: The risk or requirement that makes the control apply, or the scope fact that means it does not.}
    - {name: Status, width: 16, values: [Not started, Planned, Partial, Implemented, Not applicable], help: Implementation status. Implemented requires operating evidence.}
    - {name: Implementing documents, width: 32, help: Kit document IDs separated by semicolons. Replace with your own where you have changed them.}
    - {name: Evidence reference, width: 30, help: Folder, ticket or register row that shows the control operating.}
    - {name: Owner, width: 24, help: Role that owns the control.}
    - {name: Last reviewed, width: 14, date: true}
    - {name: Notes, width: 30}
