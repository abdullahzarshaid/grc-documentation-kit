- id: ISMS-REG-02
  key: isms-reg-02-control-implementation-tracker
  title: Control implementation tracker
  framework: iso27001
  maps:
    - ISO/IEC 27001:2022 clause 6.1.3
    - ISO/IEC 27001:2022 clause 8.1
    - ISO/IEC 27001:2022 clause 9.1
    - ISO/IEC 27001:2022 Annex A
  purpose: One row per Annex A control, tracking who owns it, how far implementation has got, where the operating evidence is, how and when it was last tested and with what result. It is the working companion of the Statement of Applicability and the source of the control test results reported under the monitoring procedure.
