- id: ISMS-REG-03
  key: isms-reg-03-interested-parties-and-requirements
  title: Interested parties and requirements register
  framework: iso27001
  maps:
    - ISO/IEC 27001:2022 clause 4.2
    - ISO/IEC 27001:2022 clause 4.1
    - ISO/IEC 27701 clause 5.2.2
  purpose: One row per requirement of each party with an interest in the organisation's security and privacy performance, stating the requirement in plain words, its type and source, whether it is met through the management system, how, and who owns it. Produced and reviewed under the context procedure and used to set the scope, the risks and the objectives.
  columns:
    - {name: Party ID, width: 10, help: Sequential reference, for example P-01.}
    - {name: Interested party, width: 26, help: The party or category, for example enterprise customers, supervisory authority, staff.}
    - {name: Internal or external, width: 12, values: [Internal, External]}
    - {name: Relationship, width: 28, help: Why this party cares about the organisation's security or privacy performance.}
    - {name: Requirement, width: 44, help: One requirement per row, in plain words.}
    - {name: Requirement type, width: 18, values: [Legal, Contractual, Voluntary commitment, Expectation]}
    - {name: Source, width: 26, help: Law, contract clause, standard, policy or correspondence that states the requirement.}
    - {name: Addressed through ISMS, width: 12, values: [Yes, No]}
    - {name: How addressed, width: 32, help: Kit document IDs, controls or the function that handles it outside the ISMS.}
    - {name: Owner, width: 22, help: Role accountable for meeting the requirement.}
