- id: ISMS-REG-04
  key: isms-reg-04-internal-audit-checklist
  title: Internal audit checklist
  framework: iso27001
  maps:
    - ISO/IEC 27001:2022 clause 9.2
    - ISO/IEC 27001:2022 clause 9.2.2
    - ISO/IEC 27001:2022 Annex A
    - SOC 2 CC4.1
  purpose: One question per clause requirement of ISO/IEC 27001:2022 and one per Annex A control, each answerable yes or no, with the evidence to ask for and the role to ask. Copied once per audit, trimmed to the audit's criteria, and completed with the result, the evidence seen and the sampling notes so that the finished copy is itself an audit record.
  columns:
    - {name: Clause or control, width: 12, fixed: true, help: Clause number 4.1 to 10.2 or Annex A control number.}
    - {name: Question, width: 60, fixed: true, help: Answer yes or no from evidence, never from the interview alone.}
    - {name: Evidence to request, width: 46, fixed: true, help: What to ask for before fieldwork. Replace kit IDs with your own document names where they differ.}
    - {name: Interviewee role, width: 24, help: Role to ask. Change it to match your organisation chart.}
    - {name: Result, width: 14, values: [Conforms, Minor, Major, Observation, Not applicable], help: Grades as defined in GOV-PRO-02 step 4.7. Not applicable needs the Statement of Applicability reason in Notes.}
    - {name: Evidence seen, width: 36, help: File names as named under PB-09. Never write seen or discussed.}
    - {name: Notes, width: 36, help: Population, sample size, selection method, exact words relied on.}
    - {name: Finding reference, width: 16, help: Finding ID in the GOV-TPL-01 report and the GOV-REG-03 entry raised from it.}
  rows:
    - ["4.1", "Has [Organisation] recorded the internal and external issues that affect what the management system must achieve, and reviewed them within the last twelve months?", "Context analysis under ISMS-PRO-01; review record or steering committee minutes showing the review", "Information Security Manager", null, null, null, null]
    - ["4.1", "Can the Information Security Manager show how at least one recorded issue led to a risk, an objective or a scope decision?", "A risk in GOV-REG-05 or an objective in ISMS-PLN-01 traceable to an issue", "Information Security Manager", null, null, null, null]
    - ["4.2", "Is there a current register of interested parties with the security and privacy requirements each one places on [Organisation]?", "ISMS-REG-03 with a review date inside the last twelve months", "Information Security Manager", null, null, null, null]
    - ["4.2", "Have the legal, regulatory and contractual requirements in that register been carried into the compliance register with an owner for each?", "GOV-REG-04 entries cross-referenced to ISMS-REG-03", "Information Security Manager; Privacy Officer", null, null, null, null]
    - ["4.3", "Is the scope of the management system written down and approved, and does it name the locations, services, systems and networks it covers?", "ISMS-STM-01 approved version and its GOV-REG-01 entry", "Information Security Manager", null, null, null, null]
    - ["4.3", "Does the scope statement explain every exclusion and describe the interfaces and dependencies with providers and other parties?", "Exclusion justifications and the shared responsibility section of ISMS-STM-01", "Information Security Manager", null, null, null, null]
    - ["4.4", "Are the processes of the management system identified, with their inputs, outputs, owners and interactions?", "Process inventory under ISMS-PRO-03", "Information Security Manager", null, null, null, null]
    - ["5.1", "Can top management show how it has directed and supported the management system beyond signing the policy?", "GOV-STM-01; steering committee minutes showing decisions by the Chief Executive Officer; budget and resource approvals", "Chief Executive Officer", null, null, null, null]
    - ["5.1", "Are security objectives part of business planning rather than held only by the security function?", "Business plan or objectives document referencing the objectives in ISMS-PLN-01", "Chief Executive Officer", null, null, null, null]
    - ["5.2", "Is the information security policy approved by top management, published to all staff and acknowledged by them?", "GOV-POL-03 approval record; publication announcement; GOV-REG-23 acknowledgement export", "Information Security Manager", null, null, null, null]
    - ["5.3", "Are the roles responsible for the management system assigned to named people and communicated, including who reports its performance to top management?", "GOV-POL-01 roles table; appointment records or job descriptions; organisation chart", "Chief Executive Officer; Information Security Manager", null, null, null, null]
    - ["6.1.1", "Have the risks and opportunities to the management system itself, not only to information assets, been identified and planned for?", "Section of the risk assessment or steering committee minutes addressing system-level risks and opportunities", "Information Security Manager", null, null, null, null]
    - ["6.1.2", "Is there an approved risk assessment method with defined likelihood and impact scales, risk owners and acceptance criteria?", "GOV-PRO-05 approved version with its scales and bands", "Information Security Manager", null, null, null, null]
    - ["6.1.2", "Would two assessors using the method reach the same rating for the same risk?", "Three sample risks in GOV-REG-05 re-rated by the auditor against the scales in GOV-PRO-05", "Risk owner", null, null, null, null]
    - ["6.1.3", "Does every risk above the acceptance threshold have a treatment plan with an owner and a due date, and does the Statement of Applicability list the controls chosen?", "GOV-REG-05 treatment columns; ISMS-REG-01 version matching the risk assessment", "Information Security Manager; Risk owner", null, null, null, null]
    - ["6.1.3", "Have risk owners approved the treatment plans and formally accepted the residual risks?", "Approval records against the treatment plan; GOV-REG-06 for accepted risks", "Risk owner", null, null, null, null]
    - ["6.2", "Are security objectives measurable, resourced, assigned to owners and reported against at a set frequency?", "ISMS-PLN-01; GOV-REG-21 with latest values", "Information Security Manager", null, null, null, null]
    - ["6.3", "When the management system was changed in the last twelve months, was the change planned with its purpose, consequences, resources and responsibilities considered?", "Change records or steering committee minutes for a scope, structure or framework change", "Information Security Manager", null, null, null, null]
    - ["7.1", "Have the resources needed to run and improve the management system been identified and provided?", "Budget lines, staffing decisions and tool approvals in steering committee minutes", "Chief Executive Officer", null, null, null, null]
    - ["7.2", "Does each role with security responsibilities have defined competence requirements, and is there evidence that the role holders meet them or that gaps are being closed?", "Competence matrix under ISMS-PRO-02; training and certification records in GOV-REG-09", "Information Security Manager; Head of People", null, null, null, null]
    - ["7.3", "Can staff at different levels say what the policy requires of them, how they contribute and what happens if they do not comply?", "Three short interviews with staff chosen by the auditor; awareness materials under GOV-PRO-08", "Staff members chosen by the auditor", null, null, null, null]
    - ["7.4", "Is there a plan that fixes what is communicated about security, when, to whom, how and by whom, and is it being followed?", "ISMS-PLN-02; samples of communications sent in the last quarter", "Information Security Manager", null, null, null, null]
    - ["7.5", "Are documents identified, reviewed, approved, versioned and available from a single controlled location, with withdrawn versions removed?", "GOV-REG-01 master list; three documents sampled against their control blocks and review dates", "Information Security Manager", null, null, null, null]
    - ["7.5", "Are records protected from alteration, retained for their defined period and retrievable when asked for?", "Access settings on the records store; retention schedule under PIMS-POL-02; retrieval of two records named by the auditor", "Information Security Manager", null, null, null, null]
    - ["8.1", "Are the processes needed to meet requirements and treat risks planned, carried out as planned, and controlled when they are outsourced?", "Process criteria under ISMS-PRO-03; supplier controls in GOV-REG-07 for outsourced processes", "Process owner", null, null, null, null]
    - ["8.2", "Have risk assessments been performed at the planned interval and after significant changes, with results retained?", "Dated risk assessment records in GOV-REG-05; triggers listed in GOV-PRO-05 compared with the changes that occurred", "Information Security Manager", null, null, null, null]
    - ["8.3", "Has the risk treatment plan been implemented as written, with results recorded?", "Treatment actions in GOV-REG-05 marked complete with evidence references", "Risk owner", null, null, null, null]
    - ["9.1", "Is a defined set of measures collected at the stated frequency, analysed by a named role and reported to management?", "Measurement set under ISMS-PRO-04; the last two quarterly reports", "Information Security Manager", null, null, null, null]
    - ["9.2", "Does the audit programme cover every clause and every applicable control within the cycle, and is each audit planned with its criteria and scope stated?", "GOV-REG-02; ISMS-PLN-03; audit plans issued for completed audits", "Internal Auditor", null, null, null, null]
    - ["9.2", "Were the auditors independent of the areas they audited, and were results reported to the relevant management?", "Independence recorded in GOV-REG-02; GOV-TPL-01 reports and their distribution", "Internal Auditor", null, null, null, null]
    - ["9.3", "Has top management reviewed the management system within the planned interval, considering every required input?", "GOV-TPL-03 minutes with each input addressed; attendance list", "Chief Executive Officer", null, null, null, null]
    - ["9.3", "Did the management review produce decisions on improvements, changes and resources, and are those decisions tracked to completion?", "Outputs section of GOV-TPL-03; GOV-REG-22 with the status of each action", "Chief Executive Officer; Information Security Manager", null, null, null, null]
    - ["10.1", "Can [Organisation] show improvements made to the management system in the last twelve months that came from its own evaluation rather than from an external audit?", "GOV-REG-03 entries sourced from measurement, review or internal audit; closed improvement actions", "Information Security Manager", null, null, null, null]
    - ["10.2", "For nonconformities found in the last twelve months, were corrections made, root causes analysed, corrective actions taken and their effectiveness verified?", "Three GOV-TPL-02 forms sampled from GOV-REG-03, including at least one closed", "Information Security Manager", null, null, null, null]
    - ["5.1", "Is there a current set of topic-specific policies, approved by the right authority, published to the people they apply to, and reviewed on schedule?", "GOV-REG-01 entries for the policies; approval records; review dates", "Information Security Manager", null, null, null, null]
    - ["5.2", "Does every control in the Statement of Applicability have a named owner role, and do those owners know they hold it?", "Owner column of ISMS-REG-01 and ISMS-REG-02; interviews with two owners", "Information Security Manager; Control owner", null, null, null, null]
    - ["5.3", "Are duties that would let one person both commit and conceal an error or a fraud separated, or compensated by monitoring where separation is impossible?", "Role design in GOV-POL-01; access rights of a sampled administrator compared with their approval role under GOV-PRO-09", "Information Security Manager; Head of Engineering", null, null, null, null]
    - ["5.4", "Do managers require their staff to follow the security rules, and can they show how they do it?", "Team meeting records, performance objectives or acknowledgement follow-up for one team", "Line manager", null, null, null, null]
    - ["5.5", "Does [Organisation] know which authorities it must contact, for what and within what time, and are the contact details current?", "Contact list under GOV-PRO-25; annual check recorded in ISMS-REG-03", "Information Security Manager; Privacy Officer", null, null, null, null]
    - ["5.6", "Does [Organisation] take part in or follow at least one security forum or specialist group, and does information from it reach the right people?", "Membership or subscription records; one example of information received and acted on", "Information Security Manager", null, null, null, null]
    - ["5.7", "Is threat information collected from defined sources, analysed for relevance and turned into actions?", "Sources list under GOV-PRO-27; two examples of an advisory leading to a change, a scan or a risk entry", "Information Security Manager", null, null, null, null]
    - ["5.8", "Was security considered from the start of the last three projects, with requirements, a risk assessment and a go-live check recorded?", "Project records; GOV-REG-29 copies and GOV-TPL-12 notes for the sampled projects", "Head of Engineering; Project lead", null, null, null, null]
    - ["5.9", "Is there an inventory of information and associated assets with an owner for each, reconciled against reality within the last quarter?", "GOV-REG-10 and GOV-REG-24; reconciliation record; spot check of three assets found in the environment", "Asset owner; Information Security Manager", null, null, null, null]
    - ["5.10", "Are the rules for acceptable use of information and assets written, published and acknowledged by every user?", "GOV-POL-02; GOV-REG-23 acknowledgement export compared with the staff list", "Information Security Manager", null, null, null, null]
    - ["5.11", "When people leave or change role, are all assets returned and is the return recorded?", "GOV-CHK-01 completed for three leavers in the last twelve months; GOV-REG-24 status for their devices", "Head of People; Line manager", null, null, null, null]
    - ["5.12", "Is there a classification scheme with defined levels, and is information actually classified at its correct level?", "Scheme in GOV-PRO-16; classification of five documents or data sets sampled by the auditor", "Information Security Manager; Asset owner", null, null, null, null]
    - ["5.13", "Is classified information labelled in a way that staff and systems can act on?", "Labels on the sampled items; labelling capability of the collaboration platform", "Asset owner", null, null, null, null]
    - ["5.14", "Are the approved channels for transferring information by classification defined, and were recent external transfers made through them?", "Channel table in GOV-PRO-23; GOV-REG-25 interface list; three recent external transfers", "Information Security Manager; Head of Engineering", null, null, null, null]
    - ["5.15", "Is access to information and systems granted only on business need, with rules that state who may approve what?", "Access rules in GOV-PRO-10; approval authority table", "Information Security Manager", null, null, null, null]
    - ["5.16", "Does every account map to one identified person or an owned service identity, with no shared or orphaned accounts?", "Account export from the identity provider compared with the staff list and GOV-REG-13", "System Owner", null, null, null, null]
    - ["5.17", "Are initial credentials issued securely, are users required to change them, and are secrets kept out of code, documents and chat?", "Joiner records; GOV-POL-06; result of a search for secrets in repositories and shared drives", "System Owner; Head of Engineering", null, null, null, null]
    - ["5.18", "Was every access grant in the sample approved before provisioning, and are access rights reviewed at the required frequency with removals carried out?", "GOV-TPL-09 forms for five grants; GOV-REG-12 reviews for the last four quarters with the account lists reviewed", "System Owner; Line manager", null, null, null, null]
    - ["5.19", "Are suppliers tiered by the data they reach and the service they provide, with due diligence proportional to the tier recorded before onboarding?", "GOV-REG-07; due diligence files for two Tier 1 suppliers", "Head of Operations", null, null, null, null]
    - ["5.20", "Do contracts with suppliers that handle the information of [Organisation] contain the required security clauses and, where relevant, processor clauses?", "Signed contracts or schedules for two suppliers; PIMS-TPL-02 where personal data is processed", "Head of Operations; Privacy Officer", null, null, null, null]
    - ["5.21", "Does [Organisation] know which sub-suppliers and components sit behind its critical suppliers and products, and does it have a way of learning about their security problems?", "Sub-processor lists; dependency inventories for in-house software; advisory subscriptions", "Head of Operations; Head of Engineering", null, null, null, null]
    - ["5.22", "Are supplier services monitored and reviewed at least annually for the top tiers, with assurance reports or certificates obtained and read?", "Review notes and assurance evidence in GOV-REG-07; SOC-PRO-02 review records", "Head of Operations", null, null, null, null]
    - ["5.23", "Is there a process for approving, configuring, monitoring and exiting cloud services, and was it followed for the most recently adopted service?", "GOV-PRO-26 must-prove evidence for one cloud service; approval record; exit plan", "Head of Engineering", null, null, null, null]
    - ["5.24", "Is there an incident management process with defined roles, severity levels and reporting channels, and have the role holders been trained or exercised?", "GOV-PRO-07; role assignments; exercise or training record in the last twelve months", "Information Security Manager", null, null, null, null]
    - ["5.25", "Are reported events assessed against written criteria to decide whether they are incidents, and is the decision recorded?", "GOV-REG-08 entries showing triage and severity for the last ten events", "Information Security Manager", null, null, null, null]
    - ["5.26", "Were the incidents in the sample handled according to the procedure, with containment, eradication, recovery and communications recorded?", "GOV-TPL-05 forms and timelines for two incidents", "Incident Lead", null, null, null, null]
    - ["5.27", "Was a post-incident review held for every incident of the required severity, and were the resulting actions tracked to closure?", "GOV-TPL-11 reviews; linked GOV-REG-03 actions and their status", "Incident Lead", null, null, null, null]
    - ["5.28", "Does the incident process preserve evidence in a way that keeps it usable in a dispute or a prosecution, and has it been done in practice?", "Evidence handling steps in GOV-PRO-07; evidence record for one incident including hashes and custody", "Incident Lead", null, null, null, null]
    - ["5.29", "Are the security controls that must keep operating during a disruption identified, and does the continuity plan say how?", "Continuity plan under GOV-PRO-13; the list of controls maintained in degraded operation", "Head of Operations", null, null, null, null]
    - ["5.30", "Have recovery requirements been set from a business impact analysis, and has the technology recovery plan been exercised within the last twelve months?", "GOV-TPL-07 worksheets; GOV-REG-16 exercise record with outcome and lessons", "Head of Operations; Head of Engineering", null, null, null, null]
    - ["5.31", "Are the legal, regulatory and contractual obligations relevant to security identified, kept current and mapped to controls?", "GOV-REG-04 with owners, review dates and control references", "Information Security Manager; Privacy Officer", null, null, null, null]
    - ["5.32", "Does [Organisation] respect software licences and the intellectual property of others, with controls that stop unlicensed use?", "Licence records in GOV-REG-24; open source licence checks under GOV-PRO-15; installation controls", "Head of Engineering", null, null, null, null]
    - ["5.33", "Are the records that law, regulation or contract require protected from loss, alteration and unauthorised access, and retained for the required period?", "Retention schedule under PIMS-POL-02; protection settings on the records store", "Information Security Manager", null, null, null, null]
    - ["5.34", "Are the privacy requirements that apply to personal data identified and implemented, with a named role accountable for them?", "PIMS-POL-01 or GDPR-POL-01; PIMS-REG-01 processing inventory; Privacy Officer appointment record", "Privacy Officer", null, null, null, null]
    - ["5.35", "Has the security programme been reviewed by someone independent of those who run it, at a planned interval or after a significant change?", "Internal audit reports on GOV-TPL-01; external assessment reports; GOV-REG-02 entries", "Internal Auditor", null, null, null, null]
    - ["5.36", "Do managers check that their areas comply with the policies and standards, and are technical compliance checks performed and acted on?", "Manager compliance reviews; configuration check results against GOV-CHK-02; actions raised", "Line manager; System Owner", null, null, null, null]
    - ["5.37", "Are the operating procedures for systems and processes written, current and available to the people who perform them?", "Procedure list in GOV-REG-01; two procedures compared with how the task is actually performed", "Process owner", null, null, null, null]
    - ["6.1", "Are background checks carried out before employment, proportional to the role and permitted by law, with the result recorded?", "Screening records for three recent starters, including one in a privileged role", "Head of People", null, null, null, null]
    - ["6.2", "Do employment contracts and contractor agreements state security and confidentiality responsibilities that survive the engagement?", "Contract template clauses; one signed employee contract and one contractor agreement", "Head of People", null, null, null, null]
    - ["6.3", "Have all staff completed induction and annual refresher training, and have people in specialist roles received role-based training?", "GOV-REG-09 completion export compared with the staff list; GOV-TPL-10 session records", "Head of People; Information Security Manager", null, null, null, null]
    - ["6.4", "Is there a disciplinary process for security violations that staff know about, and has it been applied consistently?", "Disciplinary clause in GOV-PRO-18; anonymised record of any case in the last twelve months", "Head of People", null, null, null, null]
    - ["6.5", "Are responsibilities that continue after someone leaves or changes role communicated to them and enforced?", "Exit letters or acknowledgements for two leavers; GOV-CHK-01 entries", "Head of People", null, null, null, null]
    - ["6.6", "Are confidentiality agreements in place with every employee, contractor and third party that accesses confidential information, and are they reviewed when terms change?", "Signed agreements for two contractors and one supplier; review record", "Head of People; Head of Operations", null, null, null, null]
    - ["6.7", "Are the rules for working away from the office defined, and are the devices and connections used by remote workers configured as those rules require?", "GOV-POL-05; device management export for the devices of three remote workers", "Information Security Manager; System Owner", null, null, null, null]
    - ["6.8", "Do staff know how to report a security event, and are reports received through that channel acted on?", "Reporting channel communication; three events in GOV-REG-08 reported by staff with the time to acknowledge", "Information Security Manager; Staff members chosen by the auditor", null, null, null, null]
    - ["7.1", "Are the areas that hold information or equipment defined as security perimeters, with the controls at each boundary described?", "Zone plan under GOV-PRO-17; walk-through of one office or server area", "Facilities Manager", null, null, null, null]
    - ["7.2", "Is entry to secure areas limited to authorised people, are visitors recorded and escorted, and are entry rights reviewed?", "GOV-REG-19 visitor log; access card holder list and its last review", "Facilities Manager", null, null, null, null]
    - ["7.3", "Are offices, rooms and facilities that hold sensitive information or equipment physically secured?", "Observation of locks, cabinets and server room controls during the walk-through", "Facilities Manager", null, null, null, null]
    - ["7.4", "Are premises monitored for unauthorised physical access, and is monitoring data protected and retained appropriately?", "Alarm or surveillance configuration; retention setting; privacy notice for monitoring where staff are recorded", "Facilities Manager; Privacy Officer", null, null, null, null]
    - ["7.5", "Is equipment protected against fire, flood, power failure and other environmental threats appropriate to its location?", "Detection and suppression records; maintenance of environmental controls; provider attestations for hosted equipment", "Facilities Manager; Head of Operations", null, null, null, null]
    - ["7.6", "Are rules for working in secure areas defined, including unattended work, recording devices and supervision of third parties?", "Secure area rules in GOV-PRO-17; briefing records for staff with access", "Facilities Manager", null, null, null, null]
    - ["7.7", "Are desks cleared of sensitive material and screens locked when unattended, in the office and when working remotely?", "GOV-POL-04; results of an unannounced walk-through; screen lock timeout setting from device management", "Information Security Manager", null, null, null, null]
    - ["7.8", "Is equipment sited and protected to reduce the risks from environmental threats and from unauthorised viewing or access?", "Observation of equipment placement; screen positioning in reception and shared areas", "Facilities Manager", null, null, null, null]
    - ["7.9", "Are assets taken off site authorised, tracked and protected, including laptops and removable media?", "Off-site asset records; encryption status for sampled laptops; GOV-POL-05 rules", "Information Security Manager; System Owner", null, null, null, null]
    - ["7.10", "Are removable media controlled through their life: authorised, encrypted, inventoried and disposed of securely?", "Removable media rules in GOV-PRO-16; device control setting; GOV-REG-20 disposal entries", "System Owner", null, null, null, null]
    - ["7.11", "Are power, cooling and connectivity for critical equipment protected against failure, and tested?", "Uninterruptible power and generator test records; provider attestations for hosted systems", "Facilities Manager; Head of Operations", null, null, null, null]
    - ["7.12", "Are power and network cables protected from interception, interference and damage?", "Observation of cabling routes and patch rooms; provider attestations for hosted systems", "Facilities Manager", null, null, null, null]
    - ["7.13", "Is equipment maintained as the manufacturer and the risk require, by authorised people, with records kept?", "Maintenance log; authorisation for third party maintenance staff", "Facilities Manager; System Owner", null, null, null, null]
    - ["7.14", "Is storage media verified as wiped or destroyed before equipment is disposed of or reused, with a record for each item?", "GOV-REG-20 entries with method and certificate; three disposed items traced from GOV-REG-24", "System Owner", null, null, null, null]
    - ["8.1", "Are user devices configured to a security baseline, encrypted, protected against malware and kept up to date, with the status visible centrally?", "Device management compliance report; GOV-CHK-02 workstation checks for two devices", "System Owner", null, null, null, null]
    - ["8.2", "Are privileged rights granted only to named individuals for a defined need, held separately from everyday accounts, inventoried and reviewed?", "GOV-REG-13; privileged group membership export; last review record", "System Owner", null, null, null, null]
    - ["8.3", "Is access to information restricted according to its classification and the access rules, including in shared repositories?", "Permissions on three repositories or data sets of differing classification", "System Owner; Asset owner", null, null, null, null]
    - ["8.4", "Is read and write access to source code and build pipelines restricted, logged and reviewed?", "Repository permission export; branch protection settings; last access review", "Head of Engineering", null, null, null, null]
    - ["8.5", "Is multi-factor authentication enforced for remote, administrative and cloud console access, and do password rules meet GOV-POL-06?", "Identity provider policy export; conditional access settings; exception list", "System Owner", null, null, null, null]
    - ["8.6", "Is the use of resources monitored against thresholds, and is capacity planned ahead of need?", "Capacity monitoring views; GOV-REG-17 entries; forecast for the next period", "Head of Engineering", null, null, null, null]
    - ["8.7", "Is protection against malware deployed on all in-scope endpoints and servers, kept current and backed by user awareness?", "Protection coverage report; engine and signature currency; awareness content", "System Owner", null, null, null, null]
    - ["8.8", "Are vulnerabilities identified through scanning and advisories, remediated within the severity windows, and exceptions approved?", "GOV-REG-14 with findings past due; last scan exports; GOV-REG-06 exceptions", "Head of Engineering; System Owner", null, null, null, null]
    - ["8.9", "Are secure configuration baselines defined for servers, workstations and cloud accounts, applied, and checked for drift?", "GOV-CHK-02 completed checklists; drift reports or configuration scan results", "System Owner", null, null, null, null]
    - ["8.10", "Is information deleted when no longer required, including from backups, logs and supplier systems, according to the retention schedule?", "PIMS-REG-07 checks with Pass or Fail results; deletion records; supplier deletion confirmations", "Privacy Officer; System Owner", null, null, null, null]
    - ["8.11", "Where sensitive data is used outside its primary purpose, such as in testing or analytics, is it masked, pseudonymised or otherwise reduced?", "Test data rules in GOV-PRO-15; a sampled test data set; PIMS-PRO-06 checklist", "Head of Engineering; Privacy Officer", null, null, null, null]
    - ["8.12", "Are the channels through which data could leave [Organisation] identified, with controls in place to detect or block unauthorised movement?", "GOV-PRO-23 channel list; data loss prevention or sharing settings; alerts raised", "Information Security Manager", null, null, null, null]
    - ["8.13", "Are backups taken at the defined frequency, protected, kept separately, and restored successfully in a test within the last quarter?", "Backup job history export; GOV-REG-15 restore test with the time taken", "System Owner", null, null, null, null]
    - ["8.14", "Are the systems that require high availability built with redundancy that has been tested?", "Architecture description; failover test record in GOV-REG-16 or GOV-REG-17", "Head of Engineering", null, null, null, null]
    - ["8.15", "Are the minimum events logged on every in-scope system, and are logs protected from alteration and retained for the required period?", "Logging configuration for two systems; retention setting; access rights on the log store", "System Owner", null, null, null, null]
    - ["8.16", "Are logs and alerts reviewed at the defined cadence, with anomalies investigated and recorded?", "Alert triage records; review notes; a sampled alert traced to its outcome", "Information Security Manager; System Owner", null, null, null, null]
    - ["8.17", "Are system clocks synchronised to an approved time source so that events can be correlated?", "Time configuration on two systems; a log entry compared across systems", "System Owner", null, null, null, null]
    - ["8.18", "Is the use of utility programs that can override system controls restricted to authorised administrators and logged?", "List of such utilities; who can run them; log of use", "System Owner", null, null, null, null]
    - ["8.19", "Is software installed on operational systems only through the approved process, by authorised people, with a record?", "Installation restriction settings; GOV-REG-11 change entries for recent installations", "System Owner", null, null, null, null]
    - ["8.20", "Are networks protected with a default deny posture, and are firewall rules reviewed at the set interval?", "Network diagram; rule set export; last rule review record", "Head of Engineering", null, null, null, null]
